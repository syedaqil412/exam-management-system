<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecturer Workspace</title>
    <style>
        :root { --primary: #065f46; --primary-hover: #064e3b; --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --border: #e2e8f0; --accent: #10b981; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, Arial, sans-serif; margin: 0; padding: 40px 20px; background: var(--bg); color: var(--text); }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: var(--primary); font-size: 28px; font-weight: 700; margin-bottom: 30px; display: flex; align-items: center; gap: 10px; }
        .card { background: var(--card); padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03); border: 1px solid var(--border); margin-bottom: 25px; }
        .card h3, .card h4 { margin-top: 0; color: var(--primary); font-weight: 600; margin-bottom: 20px; }
        .auth-container { max-width: 450px; margin: 60px auto; }
        input { box-sizing: border-box; width: 100%; padding: 12px 16px; margin: 8px 0 16px 0; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: #fff; color: var(--text); transition: all 0.2s; }
        input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15); }
        button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        button:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .logout-btn { max-width: 150px; background: #ef4444; margin-top: 10px; }
        .logout-btn:hover { background: #dc2626; }
        .hidden { display: none; }
        hr { border: 0; border-top: 1px solid var(--border); margin: 20px 0; }
        ul { padding: 0; margin: 0; list-style: none; }
        li { background: #fff; padding: 16px; border-radius: 8px; margin-bottom: 12px; border: 1px solid var(--border); border-left: 4px solid var(--accent); display: flex; justify-content: space-between; align-items: center; }
        .form-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        @media(min-width: 600px) { .form-grid { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>👩‍🏫 Faculty Lecturer Grading Deck</h1>
        
        <!-- 1. Authentication -->
        <div id="login-card" class="card auth-container">
            <h3>Portal Lecturer Authentication</h3>
            <input type="email" id="email" value="siti@uptm.edu.my">
            <input type="password" id="password" value="hashed_lecturer_pass">
            <button onclick="handleLogin()">Secure Login</button>
            <p id="auth-feedback" style="color:#ef4444; font-size:14px; margin-top:10px; font-weight:500;"></p>
        </div>

        <!-- 2. Dashboard -->
        <div id="dashboard-card" class="card hidden">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin:0;">Welcome Dr: <span id="user-name" style="color:var(--accent);"></span></h3>
                <button onclick="location.reload()" class="logout-btn">Logout</button>
            </div>
            <hr>
            
            <h4>Input New Student Academic Result</h4>
            <div class="form-grid">
                <div>
                    <label style="font-size:13px; font-weight:600; color:#64748b;">Student ID Reference</label>
                    <input type="number" id="studentId" placeholder="e.g. 4">
                </div>
                <div>
                    <label style="font-size:13px; font-weight:600; color:#64748b;">Course Code</label>
                    <input type="text" id="courseId" placeholder="e.g. SWC3633">
                </div>
                <div>
                    <label style="font-size:13px; font-weight:600; color:#64748b;">Grade Point</label>
                    <input type="number" step="0.01" id="gradePoint" placeholder="e.g. 4.00">
                </div>
                <div>
                    <label style="font-size:13px; font-weight:600; color:#64748b;">Grade Letter</label>
                    <input type="text" id="gradeLetter" placeholder="e.g. A">
                </div>
            </div>
            <button onclick="submitGrade()" style="margin-top: 10px; background: #10b981;">Publish Marks Entry</button>
            
            <h4 style="margin-top: 40px;">Grading Log Indexes</h4>
            <ul id="results-list"></ul>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:3000/api"; let token = "";
        async function handleLogin() {
            const res = await fetch(`${API_URL}/auth/login`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email:document.getElementById('email').value, password:document.getElementById('password').value}) });
            const data = await res.json();
            if(res.ok && data.user.role === 'Lecturer') {
                token = data.token; document.getElementById('login-card').classList.add('hidden'); document.getElementById('dashboard-card').classList.remove('hidden'); document.getElementById('user-name').innerText = data.user.name; loadResults();
            } else { document.getElementById('auth-feedback').innerText = "Access Denied: Invalid Lecturer Account."; }
        }
        async function loadResults() {
            const res = await fetch(`${API_URL}/results`, { headers:{'Authorization':`Bearer ${token}`} });
            const data = await res.json(); const list = document.getElementById('results-list'); list.innerHTML = "";
            data.forEach(r => { list.innerHTML += `<li><span>👨‍🎓 Student ID: <strong>${r.student_id}</strong> | 📘 Course: <strong>${r.course_id}</strong></span><span style="background:#e0f2fe; color:#0369a1; padding:4px 8px; border-radius:6px; font-weight:700;">Grade: ${r.grade_letter} (${r.grade_point})</span></li>`; });
        }
        async function submitGrade() {
            const res = await fetch(`${API_URL}/results`, { method:'POST', headers:{'Content-Type':'application/json', 'Authorization':`Bearer ${token}`}, body:JSON.stringify({student_id:document.getElementById('studentId').value, course_id:document.getElementById('courseId').value, grade_point:document.getElementById('gradePoint').value, grade_letter:document.getElementById('gradeLetter').value}) });
            if(res.ok) { alert('Student Marks Published!'); loadResults(); } else { alert('Error recording grades.'); }
        }
    </script>
</body>
</html>
