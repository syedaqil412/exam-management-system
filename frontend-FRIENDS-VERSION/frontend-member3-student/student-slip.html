<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - Slate Edition</title>
    <style>
        :root { --primary: #0f172a; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --text-muted: #94a3b8; --border: #334155; --accent: #0ea5e9; --accent-hover: #38bdf8; }
        body { font-family: 'Inter', Arial, sans-serif; margin: 0; padding: 40px 20px; background: var(--bg); color: var(--text); }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { color: var(--accent); font-size: 28px; font-weight: 700; margin-bottom: 30px; display: flex; align-items: center; gap: 10px; }
        .card { background: var(--card); padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); border: 1px solid var(--border); margin-bottom: 25px; }
        .card h3, .card h4 { margin-top: 0; color: var(--accent); font-weight: 600; margin-bottom: 20px; }
        .auth-container { max-width: 450px; margin: 60px auto; }
        input { box-sizing: border-box; width: 100%; padding: 12px 16px; margin: 8px 0 16px 0; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: #151d30; color: var(--text); }
        input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.2); }
        button { width: 100%; padding: 12px; background: var(--accent); color: #0f172a; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        button:hover { background: var(--accent-hover); transform: translateY(-1px); }
        .logout-btn { max-width: 150px; background: #ef4444; color: white; margin-top: 10px; }
        .logout-btn:hover { background: #dc2626; }
        .hidden { display: none; }
        hr { border: 0; border-top: 1px solid var(--border); margin: 20px 0; }
        ul { padding: 0; margin: 0; list-style: none; }
        li { background: #151d30; padding: 16px; border-radius: 8px; margin-bottom: 12px; border: 1px solid var(--border); border-left: 4px solid var(--accent); display: flex; justify-content: space-between; align-items: center; }
        .pdf-btn { background: #d97706; color: white; font-weight: 700; margin-bottom: 25px; box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3); }
        .pdf-btn:hover { background: #b45309; }
    </style>
</head>
<body>
    <div class="container">
        <h1>👨‍🎓 Student Personal Command Deck</h1>
        
        <div id="login-card" class="card auth-container">
            <h3>Portal Student Authentication</h3>
            <input type="email" id="email" value="ali@student.uptm.edu.my">
            <input type="password" id="password" value="hashed_student_pass">
            <button onclick="handleLogin()">Secure Login</button>
            <p id="auth-feedback" style="color:#ef4444; font-size:14px; margin-top:10px; font-weight:500;"></p>
        </div>

        <div id="dashboard-card" class="card hidden">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3>Welcome Student: <span id="user-name" style="color: var(--accent);"></span></h3>
                <button onclick="location.reload()" class="logout-btn">Terminate Session</button>
            </div>
            <hr>
            
            <h4>📄 Advanced Document Utility Actions</h4>
            <button onclick="downloadPdf()" class="pdf-btn">📥 Download Official Registration PDF Exam Slip</button>
            
            <h4>Your Personal Published Academic Performance</h4>
            <ul id="student-results-list"></ul>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:3000/api"; let token = "";
        async function handleLogin() {
            const res = await fetch(`${API_URL}/auth/login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value }) });
            const data = await res.json();
            if(res.ok && data.user.role === 'Student') {
                token = data.token; document.getElementById('login-card').classList.add('hidden'); document.getElementById('dashboard-card').classList.remove('hidden'); document.getElementById('user-name').innerText = data.user.name; loadStudentResults();
            } else { document.getElementById('auth-feedback').innerText = "Access Denied: Invalid Student Credentials or role mismatch."; }
        }
        async function loadStudentResults() {
            const res = await fetch(`${API_URL}/results`, { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json(); const list = document.getElementById('student-results-list'); list.innerHTML = "";
            if(data.length === 0) { list.innerHTML = "<li>No academic records published yet for your profile.</li>"; return; }
            data.forEach(r => { list.innerHTML += `<li><span>📋 <b>Course Code: ${r.course_id}</b></span><span style="background:#0c4a6e; color:#7dd3fc; padding:4px 10px; border-radius:6px; font-weight:700; border:1px solid #0284c7;">Grade: ${r.grade_letter} (${r.grade_point})</span></li>`; });
        }
        async function downloadPdf() {
            if (!token) return alert("Session token missing.");
            try {
                const res = await fetch(`${API_URL}/slips/download-slip`, { method: 'GET', headers: { 'Authorization': `Bearer ${token}` } });
                if (!res.ok) return alert(`Download failed.`);
                const blob = await res.blob(); const fileUrl = window.URL.createObjectURL(blob);
                const downloadLink = document.createElement('a'); downloadLink.href = fileUrl; downloadLink.download = `Official_Exam_Slip.pdf`;
                document.body.appendChild(downloadLink); downloadLink.click(); document.body.removeChild(downloadLink); window.URL.revokeObjectURL(fileUrl);
            } catch (error) { alert("An error occurred during compilation."); }
        }
    </script>
</body>
</html>
